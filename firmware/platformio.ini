; Прошивка брелока.
;
; keychain — своя плата rev B (nRF52840, hardware/rev-b): все датчики, голос,
; встречи по Bluetooth, сон и выключение. Код — src/keychain/.
;
;   pio run -e keychain -t upload && pio device monitor
;
; esp32* — тестовый стенд: любая ESP32 + модуль SSD1306 0.96" по I2C и, по желанию,
; сенсорная кнопка TTP223 и пищалка. Датчиков нет — проверяем эмоции на живой панели.
;
;   pio run -e esp32c5 -t upload && pio device monitor

[platformio]
default_envs = esp32c5

[env]
; Ядро Arduino-ESP32 3.3: в нём есть ESP32-C5. Официальная платформа PlatformIO
; застряла на 2.0.x, поэтому берём её продолжение pioarduino.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../engine
build_unflags = -std=gnu++11 -std=gnu++17 -std=gnu++2b -Os
build_flags = -std=gnu++2a -O2 -Wall
; Стенду не нужен код платы rev B.
build_src_filter = +<*> -<keychain/>

; ESP32-C5-DevKitC-1: SDA 0, SCL 1 (выводы I2C по умолчанию в ядре), кнопка 6, пищалка 8.
; Кнопка BOOT на плате (GPIO 28) тоже работает как кнопка.
[env:esp32c5]
board = esp32-c5-devkitc-1
build_flags = ${env.build_flags} -DPIN_SDA=0 -DPIN_SCL=1 -DPIN_BUTTON=6 -DPIN_BOOT=28 -DPIN_BUZZER=8

; Обычная ESP32 DevKit (ESP-WROOM-32): SDA 21, SCL 22, кнопка 4, пищалка 25.
[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DPIN_SDA=21 -DPIN_SCL=22 -DPIN_BUTTON=4 -DPIN_BOOT=0 -DPIN_BUZZER=25

; ESP32-C3 (SuperMini, DevKitM-1): SDA 8, SCL 9, кнопка 3, пищалка 4.
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DPIN_SDA=8 -DPIN_SCL=9 -DPIN_BUTTON=3 -DPIN_BUZZER=4 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 DevKitC: SDA 8, SCL 9, кнопка 4, пищалка 5.
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DPIN_SDA=8 -DPIN_SCL=9 -DPIN_BUTTON=4 -DPIN_BOOT=0 -DPIN_BUZZER=5

; Своя плата rev B: модуль Raytac MDBT50Q (nRF52840), ядро Adafruit nRF52 с SoftDevice S140.
; Описание платы — boards/keychain_revb.json и variants/keychain_revb. Первая прошивка —
; загрузчик через SWD (firmware/README.md), дальше обновления по USB.
[env:keychain]
platform = nordicnrf52@11.0.0
; Платформа по умолчанию берёт GCC 7, а движку нужен C++20.
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.120301.0
board = keychain_revb
board_build.variants_dir = variants
; Версия прошивки (git describe) — в приветствие консоли и команду ver.
extra_scripts =
  pre:tools/version.py
  post:tools/uf2.py
build_src_filter = +<keychain/> +<ssd1306.cpp>
lib_deps = symlink://../engine
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags = -std=gnu++2a -O2 -Wall
