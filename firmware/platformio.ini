; Прошивка брелока.
;
; Сейчас здесь тестовый стенд: любая ESP32 + модуль SSD1306 0.96" по I2C
; и, по желанию, сенсорная кнопка TTP223. Датчиков пока нет — проверяем,
; как эмоции выглядят на живой панели.
;
;   pio run -e esp32dev -t upload && pio device monitor

[platformio]
default_envs = esp32dev

[env]
platform = espressif32 @ 6.13.0
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../engine
extra_scripts = post:merge_bin.py
build_unflags = -std=gnu++11 -std=gnu++17 -Os
build_flags = -std=gnu++2a -O2 -Wall

; Обычная ESP32 DevKit (ESP-WROOM-32): SDA 21, SCL 22, кнопка 4.
[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DPIN_SDA=21 -DPIN_SCL=22 -DPIN_BUTTON=4

; ESP32-C3 (SuperMini, DevKitM-1): SDA 8, SCL 9, кнопка 3.
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DPIN_SDA=8 -DPIN_SCL=9 -DPIN_BUTTON=3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 DevKitC: SDA 8, SCL 9, кнопка 4.
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DPIN_SDA=8 -DPIN_SCL=9 -DPIN_BUTTON=4
