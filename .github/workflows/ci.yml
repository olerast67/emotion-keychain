name: CI

on:
  push:
  pull_request:
  # Выпуск релиза кнопкой: Actions → CI → Run workflow, версия вида v0.1.0.
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v0.1.0 (пусто: просто проверка)"
        required: false
        default: ""

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev clang lld

      - name: Сборка
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Тесты движка
        run: ctest --test-dir build --output-on-failure

      - name: Каталог эмоций совпадает с кодом (RU и EN)
        run: |
          ./build/facegen catalog /tmp/emotions.md
          diff -u docs/emotions.md /tmp/emotions.md
          ./build/facegen catalog --lang en /tmp/emotions.en.md
          diff -u docs/emotions.en.md /tmp/emotions.en.md

      - name: Веб-симулятор
        run: sim/web/build.sh

      - name: Превью
        run: |
          mkdir -p out
          ./build/facegen sheet out/emotions_sheet.gif --scale 2 --cols 8
          ./build/facegen bench --seconds 30 > out/bench.txt

      - uses: actions/upload-artifact@v4
        with:
          name: face-simulator
          path: |
            sim/web/dist/index.html
            out/emotions_sheet.gif
            out/bench.txt

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe видит метку версии v*

      - name: Метка версии для git describe
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: git -c user.name=ci -c user.email=ci@localhost tag -a "$VERSION" -m "$VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: PlatformIO
        run: pip install platformio

      - name: Прошивка стенда для ESP32-C5, ESP32, ESP32-C3 и ESP32-S3
        run: pio run -d firmware -e esp32c5 -e esp32dev -e esp32c3 -e esp32s3

      - name: Файлы для прошивки из браузера
        run: |
          mkdir -p out
          for d in firmware/.pio/build/*/; do
            cp "$d/firmware.factory.bin" "out/stand-$(basename "$d").bin"
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: stand-firmware
          path: out/stand-*.bin

  keychain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe видит метку версии v*

      - name: Метка версии для git describe
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: git -c user.name=ci -c user.email=ci@localhost tag -a "$VERSION" -m "$VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-nrf-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: PlatformIO
        run: pip install platformio

      - name: Прошивка платы rev B (nRF52840)
        run: pio run -d firmware -e keychain

      - name: Файлы прошивки и загрузчик
        run: |
          mkdir -p out
          cp firmware/.pio/build/keychain/firmware.hex out/keychain-revb.hex
          cp firmware/.pio/build/keychain/firmware.uf2 out/keychain-revb.uf2
          cp firmware/.pio/build/keychain/firmware.zip out/keychain-revb-dfu.zip
          cp firmware/.pio/build/keychain/firmware-factory.hex out/keychain-revb-factory.hex
          cp firmware/bootloader/*.hex out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: keychain-firmware
          path: out/*

  # Сайт на GitHub Pages: веб-симулятор (прошивка стенда из браузера — на olerast.com/projects/emotion-keychain/flash).
  # Симулятор берётся из сборки выше. Только push в main; Pages включается в настройках репозитория
  # (Settings → Pages → Source: GitHub Actions). Pages у бесплатного аккаунта — только для
  # публичного репозитория, поэтому для закрытого задание пропускается, а не падает.
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: [engine]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: face-simulator
          path: artifacts/sim

      - name: Сайт
        run: |
          sim="$(find artifacts/sim -path '*dist/index.html' | head -n 1)"
          python3 tools/build_pages.py --sim "$sim" --out site
          ls -lR site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  # Релиз на GitHub: по метке v* (git push origin v0.1.0) или кнопкой Run workflow с версией.
  # Прошивки стенда и брелока из сборок выше; отсюда их берёт страница прошивки на olerast.com.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [engine, firmware, keychain]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-firmware"
          path: out
          merge-multiple: true

      - name: Контрольные суммы
        run: |
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: gh release create "$VERSION" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
